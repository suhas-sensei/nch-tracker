<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCH Tracker</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232733;--border:#2e3340;--text:#e4e6eb;--text2:#8b8f9a;--accent:#6366f1;--accent-soft:rgba(99,102,241,.12);--open:#f59e0b;--open-bg:rgba(245,158,11,.12);--closed:#22c55e;--closed-bg:rgba(34,197,94,.12);--nch:#ef4444;--nch-bg:rgba(239,68,68,.1);--customer:#3b82f6;--customer-bg:rgba(59,130,246,.1);--noticket:#a855f7;--noticket-bg:rgba(168,85,247,.1);--unassigned:#ef4444;--unassigned-bg:rgba(239,68,68,.08);--threat:#f97316;--threat-bg:rgba(249,115,22,.1);--cc:#10b981;--cc-bg:rgba(16,185,129,.1);--subj:#eab308;--subj-bg:rgba(234,179,8,.1);--bodyref:#8b5cf6;--bodyref-bg:rgba(139,92,246,.1)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f8f9fb;--surface:#fff;--surface2:#f1f3f6;--border:#e2e5ea;--text:#1a1d27;--text2:#6b7080;--accent-soft:rgba(99,102,241,.08);--open-bg:rgba(245,158,11,.08);--closed-bg:rgba(34,197,94,.08);--nch-bg:rgba(239,68,68,.06);--customer-bg:rgba(59,130,246,.06);--noticket-bg:rgba(168,85,247,.06);--unassigned-bg:rgba(239,68,68,.05);--threat-bg:rgba(249,115,22,.06);--cc-bg:rgba(16,185,129,.06);--subj-bg:rgba(234,179,8,.06);--bodyref-bg:rgba(139,92,246,.06)}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#1a1d27;--surface2:#232733;--border:#2e3340;--text:#e4e6eb;--text2:#8b8f9a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:1200px;margin:0 auto}
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:600}
.header .subtitle{color:var(--text2);font-size:13px}
.stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:80px}
.stat .number{font-size:22px;font-weight:700}
.stat .label{font-size:10px;color:var(--text2);margin-top:2px}
.stat.s-open .number{color:var(--open)}.stat.s-closed .number{color:var(--closed)}.stat.s-nch .number{color:var(--nch)}.stat.s-noticket .number{color:var(--noticket)}
.filter-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.filter-row .label{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:4px;min-width:45px}
.filters{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.filter-btn{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.filter-btn .count{font-size:9px;opacity:.7;margin-left:3px}
.ticket-list{display:flex;flex-direction:column;gap:5px}
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;transition:all .15s;display:grid;grid-template-columns:1fr auto;gap:8px}
.ticket:hover{border-color:var(--accent);background:var(--surface2)}
.ticket.no-ticket{border-left:3px solid var(--noticket)}
.ticket.unassigned-ticket{border-left:3px solid var(--unassigned)}
.ticket-subject{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ticket-meta{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge.open{background:var(--open-bg);color:var(--open)}
.badge.closed{background:var(--closed-bg);color:var(--closed)}
.badge.no_ticket{background:var(--noticket-bg);color:var(--noticket)}
.badge.nch_direct{background:var(--nch-bg);color:var(--nch)}
.badge.nch_cc{background:var(--cc-bg);color:var(--cc)}
.badge.subject_match{background:var(--subj-bg);color:var(--subj)}
.badge.body_nch_ref{background:var(--bodyref-bg);color:var(--bodyref)}
.badge.body_threat{background:var(--threat-bg);color:var(--threat)}
.meta-text{font-size:11px;color:var(--text2)}
.meta-text strong{color:var(--text);font-weight:500}
.ticket-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:85px}
.ticket-date{font-size:11px;color:var(--text2);white-space:nowrap}
.msg-count{font-size:10px;color:var(--text2);background:var(--surface2);padding:1px 6px;border-radius:10px}
.open-btn{display:inline-flex;align-items:center;gap:3px;background:var(--accent);color:#fff;border:none;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity .15s;white-space:nowrap}
.open-btn:hover{opacity:.85}
.open-btn.disabled{background:var(--surface2);color:var(--text2);cursor:default;pointer-events:none}
.snippet{font-size:11px;color:var(--text2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:700px}
.docket{font-size:10px;color:var(--accent);font-weight:600;font-family:'SF Mono','Fira Code',monospace}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:14px}
.last-reply{font-size:9px;padding:1px 5px;border-radius:4px}
.last-reply.customer{background:var(--nch-bg);color:var(--nch)}
.last-reply.us{background:var(--closed-bg);color:var(--closed)}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--text);width:220px;outline:none}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text2)}
.nch-msg{font-size:11px;color:var(--text2);margin-top:3px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:700px}
.sep{color:var(--border);margin:0 1px}
.showing{font-size:11px;color:var(--text2);margin-bottom:8px}
</style>
</head>

let filterStatus="all",filterType="all";

const MATCH_LABELS={nch_direct:"From NCH",nch_cc:"CC'd NCH",subject_match:"Subject",body_nch_ref:"Body ref",body_threat:"Threat"};

function timeAgo(ms){const diff=Date.now()-ms;const h=Math.floor(diff/3600000);if(h<1)return"just now";if(h<24)return h+"h ago";const d=Math.floor(h/24);if(d===1)return"yesterday";return d+"d ago"}
function dateStr(ms){return new Date(ms).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}

function renderStats(data){
  const total=data.length,open=data.filter(d=>d.status==="open").length,closed=data.filter(d=>d.status==="closed").length;
  const noTicket=data.filter(d=>!d.has_ticket).length;
  const nchDirect=data.filter(d=>d.match_type==="nch_direct").length;
  const nchCC=data.filter(d=>d.match_type==="nch_cc").length;
  const subjMatch=data.filter(d=>d.match_type==="subject_match").length;
  const bodyRef=data.filter(d=>d.match_type==="body_nch_ref").length;
  const bodyThreat=data.filter(d=>d.match_type==="body_threat").length;
  const unassigned=data.filter(d=>d.has_ticket&&!d.agent).length;
  const waiting=data.filter(d=>!d.last_sender_is_us&&d.status==="open").length;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="number">${total}</div><div class="label">Total</div></div>
    <div class="stat s-nch"><div class="number">${nchDirect}</div><div class="label">From NCH</div></div>
    <div class="stat" style=""><div class="number" style="color:var(--cc)">${nchCC}</div><div class="label">CC'd NCH</div></div>
    <div class="stat"><div class="number" style="color:var(--subj)">${subjMatch}</div><div class="label">Subject</div></div>
    <div class="stat"><div class="number" style="color:var(--bodyref)">${bodyRef}</div><div class="label">Body ref</div></div>
    <div class="stat"><div class="number" style="color:var(--threat)">${bodyThreat}</div><div class="label">Threats</div></div>
    <div class="stat s-open"><div class="number">${open}</div><div class="label">Open tickets</div></div>
    <div class="stat s-closed"><div class="number">${closed}</div><div class="label">Closed</div></div>
    <div class="stat s-noticket"><div class="number">${noTicket}</div><div class="label">No ticket</div></div>`;
}

function cnt(arr,fn){return arr.filter(fn).length}

function renderFilters(){
  const statusFilters=[
    {id:"all",label:"All"},
    {id:"has_ticket",label:"Has ticket"},
    {id:"no_ticket",label:"No ticket"},
    {id:"unassigned",label:"Unassigned"},
    {id:"waiting",label:"Awaiting reply"},
    {id:"we_replied",label:"We replied"},
    {id:"closed",label:"Closed"}
  ];
  const typeFilters=[
    {id:"all",label:"All types"},
    {id:"nch_direct",label:"From NCH"},
    {id:"nch_cc",label:"CC'd NCH"},
    {id:"subject_match",label:"Subject mention"},
    {id:"body_nch_ref",label:"Body NCH ref"},
    {id:"body_threat",label:"Court/forum threat"}
  ];
  const shtml=statusFilters.map(f=>
    `<button class="filter-btn ${filterStatus===f.id?'active':''}" onclick="setFilter('status','${f.id}')">${f.label}</button>`).join("");
  const thtml=typeFilters.map(f=>
    `<button class="filter-btn ${filterType===f.id?'active':''}" onclick="setFilter('type','${f.id}')">${f.label}</button>`).join("");
  document.getElementById("filters").innerHTML=`
    <div class="filter-row"><span class="label">Status</span>${shtml}</div>
    <div class="filter-row"><span class="label">Type</span>${thtml}</div>`;
}

function setFilter(dim,val){
  if(dim==="status")filterStatus=val;
  else filterType=val;
  render();
}

function applyFilters(data){
  return data.filter(d=>{
    // Status filter
    if(filterStatus==="has_ticket"&&!d.has_ticket)return false;
    if(filterStatus==="no_ticket"&&d.has_ticket)return false;
    if(filterStatus==="unassigned"&&!(d.has_ticket&&!d.agent))return false;
    if(filterStatus==="waiting"&&!(!d.last_sender_is_us&&d.status==="open"))return false;
    if(filterStatus==="we_replied"&&!d.last_sender_is_us)return false;
    if(filterStatus==="closed"&&d.status!=="closed")return false;
    // Type filter
    if(filterType!=="all"&&d.match_type!==filterType)return false;
    return true;
  });
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  let filtered=DATA.filter(d=>{
    if(q){const hay=[d.subject,d.customer_name,d.customer_email,d.docket,d.order_id,d.agent,d.nch_message].filter(Boolean).join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  filtered=applyFilters(filtered);
  renderStats(filtered);renderFilters();
  document.getElementById("showing").textContent=`Showing ${filtered.length} of ${DATA.length} threads`;
  if(!filtered.length){document.getElementById("list").innerHTML=`<div class="empty">No threads match.</div>`;return}
  document.getElementById("list").innerHTML=filtered.map(d=>{
    const badges=[];
    if(d.status==="open")badges.push(`<span class="badge open">OPEN</span>`);
    else if(d.status==="closed")badges.push(`<span class="badge closed">CLOSED</span>`);
    else badges.push(`<span class="badge no_ticket">NO TICKET</span>`);
    const mt=d.match_type;
    badges.push(`<span class="badge ${mt}">${MATCH_LABELS[mt]||mt}</span>`);
    if(!d.last_sender_is_us&&d.has_ticket&&d.status==="open")badges.push(`<span class="last-reply customer">awaiting</span>`);
    else if(d.last_sender_is_us)badges.push(`<span class="last-reply us">replied</span>`);
    const meta=[];
    if(d.customer_name)meta.push(`<strong>${esc(d.customer_name)}</strong>`);
    if(d.customer_email)meta.push(esc(d.customer_email));
    if(d.docket)meta.push(`<span class="docket">#${d.docket}</span>`);
    if(d.order_id)meta.push(`Order ${d.order_id}`);
    if(d.agent)meta.push(`<strong>${esc(d.agent)}</strong>`);
    else if(d.has_ticket)meta.push(`<span style="color:var(--unassigned);font-weight:500">Unassigned</span>`);
    const url=prithviUrl(d);
    return `<div class="ticket ${!d.has_ticket?'no-ticket':(!d.agent?'unassigned-ticket':'')}" onclick="window.open('${url}','_blank')"><div>
      <div class="ticket-subject">${esc(d.subject||'(no subject)')}</div>
      <div class="ticket-meta">${badges.join("")}${meta.map(m=>`<span class="meta-text">${m}</span>`).join('<span class="sep">&middot;</span>')}</div>
      ${d.nch_message?`<div class="nch-msg">"${esc(d.nch_message)}"</div>`:""}
      <div class="snippet">${esc(d.last_snippet)}</div>
    </div><div class="ticket-right">
      <div class="ticket-date">${timeAgo(d.last_date_ms)}</div>
      <div class="ticket-date" style="font-size:10px">${dateStr(d.first_date_ms)} – ${dateStr(d.last_date_ms)}</div>
      <div class="msg-count">${d.messages} msg${d.messages>1?"s":""}</div>
      <a class="open-btn" href="${url}" target="_blank" onclick="event.stopPropagation()">Open &rarr;</a>
    </div></div>`;
  }).join("");
}
function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}
render();
</script>
</body>
</html>
